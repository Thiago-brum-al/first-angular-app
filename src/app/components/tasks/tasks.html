<section id="tasks">
  <header>
    <h2>
      {{ displayName }}'s Tasks
    </h2>
    <menu>
      <button (click)="addTask()">Add Task</button>
    </menu>
  </header>

  @if(showAddTask){
    <app-add-task (close)="closeModal()" [user]="user"/>
  }

  <ul>
    @for(task of selectedUserTask; track task.id){
      <li>
        <app-task [task]="task"/>
      </li>
    }
  </ul>
</section>
